      - "Evaluated by CNRC / Navy Personnel Command"
      - "Determined by target rating community health and skill match"

  - id: "PRI-08"
    category: "prior_service_accessions"
    query: "What break-in-service duration requires a prior-service Sailor to attend refresher training or boot camp?"
