[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navy-rag"
version = "0.1.0"
description = "RAG system for Navy recruiting and career questions, backed by official Navy/DoD instructions."
requires-python = ">=3.11"
dependencies = [
    # LangChain core — LCEL-native, post-1.0 API
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",

    # LangGraph — stateful agent orchestration
    "langgraph>=0.2.0",

    # Vector store
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",

    # PDF parsing
    "pypdf>=4.0.0",

    # Embeddings (sentence-transformers for local reranking)
    "sentence-transformers>=3.0.0",

    # API layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Streamlit UI
    "streamlit>=1.38.0",

    # MCP server
    "mcp[cli]>=1.30.0,<2",

    # Config & env
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # HTTP client & streaming
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",

    # Hybrid retrieval (BM25 keyword search)
    "rank-bm25>=0.2.2",

    # Observability (optional but wired in)
    "langsmith>=0.1.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
navy = "navy_rag.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/navy_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
per-file-ignores = {"app.py" = ["E501"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
