  # Prior service accessions, reenlistment eligibility codes, and commissioning (MILPERSMAN 1133-020, CNRC ORLMM)
  - id: "PRI-01"
    category: "prior_service_accessions"
    query: "What does an RE-4 reenlistment code mean and can an RE-4 veteran enlist in the Navy?"
    expected_doc_ids: ["milpersman_1133_020", "comnavcruitcominst_1130_8"]
    expected_citations: ["MILPERSMAN 1133-020", "COMNAVCRUITCOMINST 1130.8"]
    ground_truth_answer: "An RE-4 reenlistment eligibility code signifies ineligibility for reenlistment or military accession, typically issued for misconduct or disciplinary separation. It is non-waiverable unless the former service member successfully petitions the Naval Discharge Review Board (NDRB) or BCNR to upgrade their code."
    key_facts:
      - "RE-4 signifies ineligibility for reenlistment"
      - "Non-waiverable without board of correction (BCNR/NDRB) code change"

  - id: "PRI-02"
    category: "prior_service_accessions"
    query: "What is the waiver process for a prior-service veteran with an RE-3 code?"
    expected_doc_ids: ["milpersman_1133_020", "comnavcruitcominst_1130_8"]
    expected_citations: ["MILPERSMAN 1133-020", "COMNAVCRUITCOMINST 1130.8"]
    ground_truth_answer: "An RE-3 code indicates eligible for reenlistment with an authorized waiver. Waivers are adjudicated by Commander, Navy Recruiting Command (CNRC) based on the underlying separation reason (e.g., medical, parenthood, performance)."
    key_facts:
      - "RE-3 codes are waiverable"
      - "Adjudicated by CNRC based on separation reason"

  - id: "PRI-03"
    category: "prior_service_accessions"
    query: "What is the maximum age limit for non-prior service enlisted Navy recruits?"
    expected_doc_ids: ["comnavcruitcominst_1130_8", "dodi_1304_26"]
    expected_citations: ["COMNAVCRUITCOMINST 1130.8", "DoDI 1304.26"]
    ground_truth_answer: "The statutory maximum accession age for active duty enlisted recruits in the Navy is 41 years old (applicants must ship to Recruit Training Command before their 42nd birthday)."
    key_facts:
      - "Maximum age is 41 years old"
      - "Must ship to RTC before 42nd birthday"

  - id: "PRI-04"
    category: "prior_service_accessions"
    query: "How is prior active service credited against the maximum enlistment age limit?"
    expected_doc_ids: ["milpersman_1133_020", "dodi_1304_26", "comnavcruitcominst_1130_8"]
    expected_citations: ["MILPERSMAN 1133-020", "DoDI 1304.26", "COMNAVCRUITCOMINST 1130.8"]
    ground_truth_answer: "For prior service applicants, creditable previous active military service is subtracted from the applicant's chronological age to determine their adjusted accession age, ensuring they can complete 20 years of active service before mandatory retirement."
    key_facts:
      - "Prior active duty years subtracted from chronological age"
      - "Must be able to reach 20 creditable years before statutory retirement"

  - id: "PRI-05"
    category: "prior_service_accessions"
    query: "What basic eligibility and GPA requirements govern Officer Candidate School (OCS) applications?"
    expected_doc_ids: ["cnrc_orlmm", "comnavcruitcominst_1131_2"]
    expected_citations: ["CNRC ORLMM", "COMNAVCRUITCOMINST 1131.2"]
    ground_truth_answer: "OCS applicants must be U.S. citizens, hold a baccalaureate degree from an accredited institution with a minimum cumulative GPA (typically 2.8 or higher depending on designator), and achieve qualifying scores on the Officer Aptitude Rating (OAR)."
    key_facts:
      - "U.S. citizenship and accredited bachelor's degree"
      - "Qualifying OAR exam score"

  - id: "PRI-06"
    category: "prior_service_accessions"
    query: "What are the age limits and requirements for Navy Aviation Officer Candidate (Student Naval Aviator)?"
    expected_doc_ids: ["cnrc_orlmm", "comnavcruitcominst_1131_2"]
    expected_citations: ["CNRC ORLMM", "COMNAVCRUITCOMINST 1131.2"]
    ground_truth_answer: "Student Naval Aviator (SNA) applicants must be between 19 and 32 years of age at the time of commissioning, achieve passing scores on the ASTB-E (Aviation Selection Test Battery), and pass Class 1 Flight Physical vision standards."
    key_facts:
      - "Age limit 19 to 32 at commissioning"
      - "Passing ASTB-E score and Class 1 flight physical"

  - id: "PRI-07"
    category: "prior_service_accessions"
    query: "How does paygrade determination work for prior service enlisted members transferring from other military branches?"
